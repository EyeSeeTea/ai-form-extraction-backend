services:
  migrate:
    image: dhis2-app-backend-skeleton
    build:
      context: .
    environment:
      DATABASE_PATH: /app/data/app.sqlite
    volumes:
      - sqlite-data:/app/data
    command: yarn db:migrate

  app:
    image: dhis2-app-backend-skeleton
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_PATH: /app/data/app.sqlite
      CORS_ORIGIN: ""
      OTEL_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
